name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -p 'verify*.py' -v
      - run: cc -std=c11 -Wall -Wextra -Werror verify_firmware.c -lm -o /tmp/dashboard-check
      - run: /tmp/dashboard-check
      - run: bash -n build_flash.sh
